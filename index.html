<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Tidur Cantikku</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;

  background-image:url('bg-anime.png');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

/* ✨ gelap cinematic */
body::before{
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.35);
  z-index:0;
}

/* ✨ glow */
body::after{
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(circle at 50% 40%, rgba(255,180,220,.25), transparent 60%);
  pointer-events:none;
  z-index:1;
}

.container{
  z-index:2;
  animation:fade 2s ease;
  padding:20px;
}

h1{
  font-size:60px;
  font-weight:700;
  letter-spacing:1px;
  background:linear-gradient(45deg,#ffd6ec,#ffffff,#ffcce6);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 35px rgba(255,180,220,.8);
}

.heart{
  font-size:46px;
  margin:22px 0;
  animation:beat 1.6s infinite;
  filter:drop-shadow(0 0 15px #ff6fa5);
}

p{
  font-size:24px;
  line-height:1.8;
  opacity:.95;
  text-shadow:0 0 10px rgba(255,255,255,.3);
}

@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.3)}
}

@keyframes fade{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}

/* ⭐ stars */
.star{
  position:fixed;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  animation:twinkle 2s infinite alternate;
  z-index:1;
}
@keyframes twinkle{
  from{opacity:.2}
  to{opacity:1}
}

/* 🌸 petals */
.petal{
  position:fixed;
  top:-10px;
  animation:fall linear forwards;
  opacity:.9;
  z-index:1;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg)}
}

.footer{
  position:fixed;
  bottom:20px;
  width:100%;
  font-size:14px;
  opacity:.7;
  z-index:2;
}
</style>
</head>
<body>

<div class="container">
  <h1>Selamat Tidur Cantikku</h1>
  <div class="heart">❤️</div>
  <p>
    Pejamkan matamu ya sayang…<br><br>
    Semoga tidurmu nyenyak dan mimpimu indah ✨<br>
    Aku selalu ada untukmu ♡
  </p>
</div>

<div class="footer">Dibuat dengan cinta</div>

<script>
/* ⭐ stars */
for(let i=0;i<160;i++){
  const s=document.createElement('div');
  s.className='star';
  s.style.left=Math.random()*100+'vw';
  s.style.top=Math.random()*100+'vh';
  s.style.animationDuration=(Math.random()*2+1)+'s';
  document.body.appendChild(s);
}

/* 🌸 petals */
function createPetal(){
  const p=document.createElement('div');
  p.className='petal';
  p.innerHTML='🌸';
  p.style.left=Math.random()*100+'vw';
  p.style.fontSize=(Math.random()*14+14)+'px';
  p.style.animationDuration=(Math.random()*6+6)+'s';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),12000);
}
setInterval(createPetal,300);
</script>

</body>
</html>
