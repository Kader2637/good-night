<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Tidur Cantikku</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            width: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #0b0e14 url('bg-anime.png') center/cover no-repeat;
        }

        /* ✨ Overlay Cinematic (Biar teks kebaca tanpa card) */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.6));
            z-index: 0;
        }

        .container {
            z-index: 2;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            animation: fadeUp 2.5s ease forwards;
        }

        h1 {
            font-size: clamp(34px, 10vw, 64px); 
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffd6ec, #ffffff, #ffcce6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Shadow kuat biar teks tajam tanpa card */
            filter: drop-shadow(0 0 30px rgba(255, 180, 220, 0.6));
        }

        .heart {
            font-size: clamp(40px, 12vw, 55px);
            margin: 20px 0;
            animation: beat 1.6s infinite;
            filter: drop-shadow(0 0 15px #ff6fa5);
            display: inline-block;
        }

        p {
            font-size: clamp(16px, 5vw, 24px);
            line-height: 1.8;
            opacity: 0.9;
            font-weight: 300;
            padding: 0 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ⭐ stars */
        .star {
            position: fixed;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite alternate;
            z-index: 1;
        }

        @keyframes twinkle {
            from { opacity: 0.2; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        /* 🌸 petals */
        .petal {
            position: fixed;
            top: -50px;
            animation: fall linear forwards;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes fall {
            to { 
                transform: translateY(110vh) translateX(150px) rotate(720deg); 
                opacity: 0;
            }
        }

        .footer {
            position: fixed;
            bottom: 25px;
            width: 100%;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.4;
            z-index: 2;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Selamat Tidur Cantikku</h1>
    <div class="heart">❤️</div>
    <p>
        Pejamkan matamu ya sayang…<br>
        Semoga tidurmu nyenyak dan mimpimu indah ✨<br>
        Aku selalu ada untukmu ♡
    </p>
</div>

<div class="footer">Dibuat dengan cinta</div>

<script>
    /* ⭐ Bintang adaptif layar */
    const starCount = window.innerWidth < 600 ? 70 : 140;
    for(let i=0; i<starCount; i++){
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.top = Math.random() * 100 + 'vh';
        s.style.setProperty('--duration', (Math.random() * 3 + 1) + 's');
        document.body.appendChild(s);
    }

    /* 🌸 Kelopak bunga sakura */
    function createPetal(){
        const p = document.createElement('div');
        p.className = 'petal';
        p.innerHTML = '🌸';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.fontSize = (Math.random() * 12 + 12) + 'px';
        p.style.animationDuration = (Math.random() * 5 + 6) + 's';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 11000);
    }

    setInterval(createPetal, window.innerWidth < 600 ? 500 : 300);
</script>

</body>
</html>
