<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Tidur Cantikku</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            width: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #0b0e14; /* Fallback color */
            background-image: url('bg-anime.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ✨ Overlay gelap cinematic */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        /* ✨ Glow lembut */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, rgba(255, 180, 220, 0.2), transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            z-index: 2;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            animation: fadeUp 2s ease forwards;
            /* Efek box transparan tipis */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: clamp(32px, 8vw, 56px); /* Ukuran adaptif otomatis */
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffd6ec, #ffffff, #ffcce6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 180, 220, 0.5));
        }

        .heart {
            font-size: clamp(40px, 10vw, 50px);
            margin: 15px 0;
            animation: beat 1.6s infinite;
            filter: drop-shadow(0 0 15px #ff6fa5);
            display: inline-block;
        }

        p {
            font-size: clamp(16px, 4.5vw, 22px);
            line-height: 1.6;
            opacity: 0.9;
            font-weight: 300;
        }

        /* 📱 Khusus layar HP sangat kecil */
        @media (max-width: 380px) {
            .container { padding: 15px; }
            h1 { font-size: 28px; }
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ⭐ stars */
        .star {
            position: fixed;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite alternate;
            z-index: 1;
        }

        @keyframes twinkle {
            from { opacity: 0.1; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        /* 🌸 petals */
        .petal {
            position: fixed;
            top: -50px;
            animation: fall linear forwards;
            z-index: 1;
            user-select: none;
        }

        @keyframes fall {
            to { 
                transform: translateY(110vh) translateX(100px) rotate(720deg); 
                opacity: 0;
            }
        }

        .footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.5;
            z-index: 2;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Selamat Tidur Cantikku</h1>
    <div class="heart">❤️</div>
    <p>
        Pejamkan matamu ya sayang…<br><br>
        Semoga tidurmu nyenyak dan mimpimu indah ✨<br>
        Aku selalu ada untukmu ♡
    </p>
</div>

<div class="footer">Dibuat dengan cinta</div>

<script>
    /* ⭐ Bintang yang lebih efisien */
    const starCount = window.innerWidth < 600 ? 80 : 150; // Lebih sedikit di HP biar gak berat
    for(let i=0; i<starCount; i++){
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.top = Math.random() * 100 + 'vh';
        s.style.setProperty('--duration', (Math.random() * 3 + 1) + 's');
        document.body.appendChild(s);
    }

    /* 🌸 Kelopak bunga sakura */
    function createPetal(){
        const p = document.createElement('div');
        p.className = 'petal';
        p.innerHTML = '🌸';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.fontSize = (Math.random() * 10 + 15) + 'px';
        p.style.animationDuration = (Math.random() * 5 + 5) + 's';
        p.style.opacity = Math.random() * 0.5 + 0.5;
        document.body.appendChild(p);
        
        // Hapus elemen setelah jatuh agar ram tetap lega
        setTimeout(() => p.remove(), 10000);
    }

    // Interval lebih lambat di HP agar mulus
    const interval = window.innerWidth < 600 ? 600 : 300;
    setInterval(createPetal, interval);
</script>

</body>
</html>
